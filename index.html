<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07070f">
<title>SK YT Download</title>
<link rel="icon" href="favicon.png" type="image/png">
<style>
  :root {
    --bg: #07070f;
    --cyan: #19e3ff;
    --violet: #7a5cff;
    --magenta: #ff2bd6;
    --text: #f2f4ff;
    --muted: rgba(242, 244, 255, 0.62);
    --glass: rgba(255, 255, 255, 0.06);
    --glass-strong: rgba(255, 255, 255, 0.1);
    --stroke: rgba(255, 255, 255, 0.14);
    --ok: #3dffb0;
    --err: #ff5c7a;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: ui-rounded, "SF Pro Rounded", "Nunito", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
    -webkit-tap-highlight-color: transparent;
  }

  /* Ambient neon orbs */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(70px);
    opacity: 0.55;
    pointer-events: none;
    z-index: 0;
    animation: drift 18s ease-in-out infinite alternate;
  }
  .orb.o1 { width: 46vmax; height: 46vmax; background: var(--cyan); top: -18vmax; left: -14vmax; }
  .orb.o2 { width: 40vmax; height: 40vmax; background: var(--magenta); bottom: -16vmax; right: -12vmax; animation-delay: -6s; }
  .orb.o3 { width: 30vmax; height: 30vmax; background: var(--violet); top: 40%; left: 55%; opacity: 0.35; animation-delay: -11s; }

  @keyframes drift {
    from { transform: translate3d(0, 0, 0) scale(1); }
    to   { transform: translate3d(4vmax, 3vmax, 0) scale(1.12); }
  }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 440px;
    max-height: 100%;
    overflow-y: auto;
    scrollbar-width: none;
    padding: 26px 22px 22px;
    border-radius: 32px;
    background: var(--glass);
    border: 1px solid var(--stroke);
    backdrop-filter: blur(20px) saturate(140%);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.18);
  }
  .card::-webkit-scrollbar { display: none; }

  h1 {
    text-align: center;
    font-size: clamp(1.55rem, 6.2vw, 1.95rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    margin-bottom: 20px;
    background: linear-gradient(100deg, var(--cyan), var(--violet) 55%, var(--magenta));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 18px rgba(122, 92, 255, 0.45));
  }

  /* URL input */
  .field {
    position: relative;
    display: flex;
    align-items: center;
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.28);
    border: 1px solid var(--stroke);
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .field:focus-within {
    border-color: rgba(25, 227, 255, 0.75);
    box-shadow: 0 0 0 4px rgba(25, 227, 255, 0.14), 0 0 24px rgba(25, 227, 255, 0.28);
  }
  .field.shake { animation: shake 0.42s ease; border-color: var(--err); }

  @keyframes shake {
    20%, 60% { transform: translateX(-6px); }
    40%, 80% { transform: translateX(6px); }
  }

  .field input {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font: inherit;
    font-size: 1rem;
    padding: 16px 8px 16px 20px;
  }
  .field input::placeholder { color: var(--muted); }

  .paste {
    flex: none;
    width: 40px;
    height: 40px;
    margin-right: 6px;
    border: none;
    border-radius: 50%;
    background: var(--glass-strong);
    color: var(--text);
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: transform 0.15s ease, background 0.2s ease;
  }
  .paste:hover { background: rgba(255, 255, 255, 0.18); transform: scale(1.08); }
  .paste:active { transform: scale(0.92); }
  .paste svg { width: 18px; height: 18px; }

  /* Quality pills */
  .quality {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin: 14px 0;
  }
  .pill {
    padding: 11px 6px;
    border-radius: 999px;
    border: 1px solid var(--stroke);
    background: var(--glass);
    color: var(--muted);
    font: inherit;
    font-size: 0.92rem;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.2s ease, color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .pill:hover { transform: scale(1.05); color: var(--text); }
  .pill:active { transform: scale(0.94); }
  .pill[aria-checked="true"] {
    color: #04101a;
    background: linear-gradient(120deg, var(--cyan), var(--violet));
    border-color: transparent;
    box-shadow: 0 0 20px rgba(25, 227, 255, 0.4);
  }
  .pill:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* Main button */
  .go {
    width: 100%;
    padding: 17px;
    border: none;
    border-radius: 999px;
    font: inherit;
    font-size: 1.05rem;
    font-weight: 800;
    letter-spacing: 0.01em;
    color: #fff;
    cursor: pointer;
    background: linear-gradient(110deg, var(--cyan), var(--violet) 50%, var(--magenta));
    box-shadow: 0 10px 34px rgba(122, 92, 255, 0.5), 0 0 30px rgba(255, 43, 214, 0.22);
    transition: transform 0.18s ease, box-shadow 0.25s ease, filter 0.25s ease;
  }
  .go:hover { transform: scale(1.03); box-shadow: 0 14px 44px rgba(122, 92, 255, 0.65), 0 0 40px rgba(25, 227, 255, 0.35); }
  .go:active { transform: scale(0.96); }
  .go.cancel { background: linear-gradient(110deg, #3a3d55, #2a2c40); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4); }

  /* Status + result share one slot */
  .slot { margin-top: 16px; }
  .slot[hidden] { display: none; }

  .status .title {
    font-size: 0.95rem;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 10px;
  }
  .bar {
    position: relative;
    height: 10px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.1);
    overflow: hidden;
  }
  .bar > i {
    position: absolute;
    inset: 0 auto 0 0;
    width: 0%;
    border-radius: inherit;
    background: linear-gradient(90deg, var(--cyan), var(--violet), var(--magenta));
    box-shadow: 0 0 16px rgba(25, 227, 255, 0.7);
    transition: width 0.5s ease;
  }
  .bar.indeterminate > i {
    width: 38%;
    animation: slide 1.3s ease-in-out infinite;
  }
  @keyframes slide {
    from { transform: translateX(-100%); }
    to   { transform: translateX(270%); }
  }
  .status .pct {
    margin-top: 8px;
    text-align: right;
    font-size: 0.82rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .result {
    padding: 16px;
    border-radius: 24px;
    background: var(--glass-strong);
    border: 1px solid rgba(61, 255, 176, 0.35);
    box-shadow: 0 0 26px rgba(61, 255, 176, 0.12);
  }
  .result .title {
    font-size: 0.98rem;
    font-weight: 700;
    line-height: 1.3;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 10px;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .chip {
    padding: 5px 11px;
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid var(--stroke);
    font-size: 0.8rem;
    color: var(--muted);
  }
  .save {
    display: block;
    text-align: center;
    text-decoration: none;
    padding: 14px;
    border-radius: 999px;
    font-weight: 800;
    color: #04140d;
    background: linear-gradient(110deg, var(--ok), var(--cyan));
    box-shadow: 0 8px 26px rgba(61, 255, 176, 0.35);
    transition: transform 0.18s ease, box-shadow 0.25s ease;
  }
  .save:hover { transform: scale(1.03); }
  .save:active { transform: scale(0.96); }

  /* Toast */
  .toast {
    position: fixed;
    left: 50%;
    bottom: max(22px, env(safe-area-inset-bottom));
    z-index: 10;
    max-width: min(92vw, 420px);
    padding: 13px 20px;
    border-radius: 999px;
    font-size: 0.92rem;
    font-weight: 600;
    text-align: center;
    color: var(--text);
    background: rgba(18, 18, 34, 0.78);
    border: 1px solid var(--stroke);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, 18px) scale(0.96);
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
  .toast.info    { border-color: rgba(25, 227, 255, 0.55); box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55), 0 0 22px rgba(25, 227, 255, 0.25); }
  .toast.success { border-color: rgba(61, 255, 176, 0.6);  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55), 0 0 22px rgba(61, 255, 176, 0.25); }
  .toast.error   { border-color: rgba(255, 92, 122, 0.65); box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55), 0 0 22px rgba(255, 92, 122, 0.28); }

  :focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }

  @media (max-height: 560px) {
    h1 { margin-bottom: 12px; }
    .card { padding: 18px 18px 16px; }
    .slot { margin-top: 12px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <div class="orb o1" aria-hidden="true"></div>
  <div class="orb o2" aria-hidden="true"></div>
  <div class="orb o3" aria-hidden="true"></div>

  <main class="card">
    <h1>SK YT Download</h1>

    <div class="field" id="field">
      <input id="url" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Paste a YouTube link" aria-label="YouTube link">
      <button class="paste" id="paste" type="button" aria-label="Paste from clipboard" title="Paste">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="3" width="8" height="4" rx="1.5"/><path d="M16 5h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2"/></svg>
      </button>
    </div>

    <div class="quality" id="quality" role="radiogroup" aria-label="Quality"></div>

    <button class="go" id="go" type="button">Download</button>

    <section class="slot status" id="status" hidden aria-live="polite">
      <div class="title" id="statusTitle"></div>
      <div class="bar indeterminate" id="bar"><i id="barFill"></i></div>
      <div class="pct" id="pct"></div>
    </section>

    <section class="slot result" id="result" hidden>
      <div class="title" id="resTitle"></div>
      <div class="chips" id="resChips"></div>
      <a class="save" id="resSave" href="#" target="_blank" rel="noopener">Save file</a>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  'use strict';

  /* ---------- Config ---------- */
  const API_BASE = '/api';

  const FORMATS = [
    { id: '1080',      label: '1080p', video: true  },
    { id: '720',       label: '720p',  video: true  },
    { id: '480',       label: '480p',  video: true  },
    { id: '360',       label: '360p',  video: true  },
    { id: 'audio-mp3', label: 'MP3',   video: false },
    { id: 'audio',     label: 'Audio', video: false }
  ];
  const VIDEO_CHAIN = FORMATS.filter(f => f.video).map(f => f.id);
  const labelOf = id => (FORMATS.find(f => f.id === id) || { label: id }).label;

  const FAIL_MESSAGES = {
    AGE_RESTRICTED: 'This video is age-restricted and can’t be downloaded.',
    MEMBERS_ONLY: 'This video is for channel members only.',
    PAYMENT_REQUIRED: 'This video needs a purchase or rental.',
    PRIVATE_VIDEO: 'This video is private.',
    VIDEO_PREMIERE: 'This premiere hasn’t aired yet. Try again after it starts.',
    GEO_RESTRICTED: 'This video isn’t available in the server’s region.',
    VIDEO_PROCESSING: 'YouTube is still processing this video. Try again later.',
    VIDEO_UNAVAILABLE: 'This video is unavailable.',
    DRM_PROTECTED: 'This video is DRM protected.',
    VIDEO_NOT_FOUND: 'Video not found. It may have been deleted.',
    FORMAT_UNAVAILABLE: 'No available quality could be delivered for this video.',
    LIVE_STREAM_IN_PROGRESS: 'This stream is still live. Try again once it ends.',
    COPYRIGHTED_MUSIC: 'Copyrighted music can’t be downloaded here.',
    NO_DOWNLOAD_OPT_OUT: 'The creator has opted out of downloads.',
    FILE_TOO_LARGE: 'This file is too large. Pick a lower quality.',
    NETWORK_ERROR: 'A temporary network error occurred. Try again.'
  };

  const STAGE_LABELS = {
    queued: 'In queue',
    starting: 'Starting',
    extracting: 'Reading video',
    downloading: 'Downloading',
    processing: 'Processing',
    uploading: 'Preparing file'
  };

  /* ---------- Elements ---------- */
  const $ = id => document.getElementById(id);
  const els = {
    field: $('field'), url: $('url'), paste: $('paste'), quality: $('quality'), go: $('go'),
    status: $('status'), statusTitle: $('statusTitle'), bar: $('bar'), barFill: $('barFill'), pct: $('pct'),
    result: $('result'), resTitle: $('resTitle'), resChips: $('resChips'), resSave: $('resSave'),
    toast: $('toast')
  };

  /* ---------- State ---------- */
  let selected = '1080';
  let busy = false;
  let controller = null;
  let toastTimer = null;

  try {
    const saved = localStorage.getItem('sk-yt-quality');
    if (saved && FORMATS.some(f => f.id === saved)) selected = saved;
  } catch (_) { /* storage unavailable */ }

  /* ---------- Toast ---------- */
  function toast(message, type = 'info', sticky = false, ms = 4200) {
    clearTimeout(toastTimer);
    els.toast.textContent = message;
    els.toast.className = 'toast show ' + type;
    if (!sticky) toastTimer = setTimeout(() => els.toast.classList.remove('show'), ms);
  }

  /* ---------- Quality pills ---------- */
  function renderPills() {
    els.quality.textContent = '';
    FORMATS.forEach(f => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'pill';
      b.setAttribute('role', 'radio');
      b.setAttribute('aria-checked', String(f.id === selected));
      b.textContent = f.label;
      b.disabled = busy;
      b.addEventListener('click', () => {
        selected = f.id;
        try { localStorage.setItem('sk-yt-quality', selected); } catch (_) {}
        renderPills();
      });
      els.quality.appendChild(b);
    });
  }

  /* ---------- URL parsing ---------- */
  function parseVideoId(raw) {
    const text = (raw || '').trim();
    if (!text) return null;
    let u;
    try { u = new URL(/^https?:\/\//i.test(text) ? text : 'https://' + text); } catch (_) { return null; }
    const host = u.hostname.replace(/^www\./, '').replace(/^m\./, '').replace(/^music\./, '');
    let id = null;
    if (host === 'youtu.be') {
      id = u.pathname.split('/')[1];
    } else if (host === 'youtube.com' || host === 'youtube-nocookie.com') {
      if (u.pathname === '/watch') id = u.searchParams.get('v');
      else {
        const m = u.pathname.match(/^\/(?:live|shorts|embed|v)\/([^/?#]+)/);
        if (m) id = m[1];
      }
    }
    return id && /^[A-Za-z0-9_-]{11}$/.test(id) ? id : null;
  }

  /* ---------- API ---------- */
  class ApiError extends Error {
    constructor(message, info = {}) {
      super(message);
      this.name = 'ApiError';
      this.status = info.status || 0;
      this.code = info.code || '';
      this.retryAfter = info.retryAfter || 0;
    }
  }

  const sleep = (ms, signal) => new Promise((resolve, reject) => {
    if (signal && signal.aborted) return reject(new DOMException('Aborted', 'AbortError'));
    const t = setTimeout(() => {
      if (signal) signal.removeEventListener('abort', onAbort);
      resolve();
    }, ms);
    function onAbort() { clearTimeout(t); reject(new DOMException('Aborted', 'AbortError')); }
    if (signal) signal.addEventListener('abort', onAbort, { once: true });
  });

async function api(path, { method = 'GET', body, headers = {}, signal } = {}) {
  let res;
  try {
    res = await fetch(API_BASE + path, {
      method,
      signal,
      headers: Object.assign(
        body ? { 'Content-Type': 'application/json' } : {},
        headers
      ),
      body: body ? JSON.stringify(body) : undefined
    });
  } catch (e) {
    if (e.name === 'AbortError') throw e;
    throw new ApiError('Couldn’t reach the server. Check your connection and try again.', { code: 'NETWORK' });
  }

  // Safely parse JSON or handle non-JSON responses (like Cloudflare 404/500 HTML pages)
  let data = null;
  const contentType = res.headers.get('content-type') || '';
  if (contentType.includes('application/json')) {
    try { data = await res.json(); } catch (_) {}
  }

  if (!res.ok) {
    if (res.status === 404 && (!data || !data.code)) {
      throw new ApiError('The /api route isn’t running. Make sure your function file path is correct.', { status: 404, code: 'NO_PROXY' });
    }
    throw new ApiError((data && data.error) || ('Request failed (' + res.status + ')'), {
      status: res.status,
      code: data ? data.code : 'UNKNOWN',
      retryAfter: Number(res.headers.get('Retry-After')) || 0
    });
  }
  return data || {};
}

  async function submitJob(url, format, signal) {
    const key = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));
    let attempt = 0;
    while (true) {
      try {
        return await api('/download', {
          method: 'POST',
          body: { url, format },
          headers: { 'Idempotency-Key': key },
          signal
        });
      } catch (e) {
        if (e.name === 'AbortError') throw e;
        const retryable = e.status === 503 || e.status === 500 || e.code === 'NETWORK' || e.status === 409;
        if (retryable && attempt < 2) {
          attempt++;
          await sleep(Math.max(e.retryAfter * 1000, 1500 * attempt), signal);
          continue;
        }
        if (e.code === 'LIMIT_REACHED') throw new ApiError('The download limit for this plan has been reached.', e);
        if (e.code === 'UNAUTHORIZED') throw new ApiError('The API key was rejected. Check VIDKRAKEN_API_KEY on the server.', e);
        if (e.code === 'TOO_MANY_PENDING') throw new ApiError('Too many downloads in progress. Wait a moment and try again.', e);
        if (e.code === 'VIDEO_NOT_FOUND') throw new ApiError('Video not found. It may be private or deleted.', e);
        throw e;
      }
    }
  }

  async function waitForJob(jobId, signal, onUpdate) {
    const started = Date.now();
    let fails = 0;
    while (true) {
      if (Date.now() - started > 20 * 60 * 1000) {
        throw new ApiError('Timed out waiting for the file. Try again.', { code: 'TIMEOUT' });
      }
      let job;
      try {
        job = await api('/download/' + encodeURIComponent(jobId), { signal });
        fails = 0;
      } catch (e) {
        if (e.name === 'AbortError') throw e;
        const transient = e.code === 'NETWORK' || e.status >= 500;
        if (transient && ++fails <= 5) { await sleep(2500, signal); continue; }
        throw e;
      }
      if (job.status === 'COMPLETED' || job.status === 'FAILED') return job;
      onUpdate(job);
      await sleep(job.status === 'IN_QUEUE' ? 1000 : 500, signal);
    }
  }

  /* ---------- UI helpers ---------- */
  function setBusy(on) {
    busy = on;
    els.go.textContent = on ? 'Cancel' : 'Download';
    els.go.classList.toggle('cancel', on);
    els.url.disabled = on;
    renderPills();
  }

  function showStatus(title) {
    els.result.hidden = true;
    els.status.hidden = false;
    els.statusTitle.textContent = title || 'Preparing…';
    els.bar.classList.add('indeterminate');
    els.barFill.style.width = '';
    els.pct.textContent = '';
  }

  function hideStatus() {
    els.status.hidden = true;
    els.barFill.style.width = '0%';
  }

  function renderProgress(job) {
    if (job.title) els.statusTitle.textContent = job.title;
    const p = job.progress;
    const stage = p ? (STAGE_LABELS[p.stage] || 'Working') : 'In queue';
    let line = stage;
    if (p && p.stage === 'queued' && p.queuePosition) line += ' (position ' + p.queuePosition + ')';
    if (p && typeof p.percent === 'number' && p.percent > 0) {
      els.bar.classList.remove('indeterminate');
      els.barFill.style.width = Math.min(100, p.percent) + '%';
      els.pct.textContent = p.percent + '%';
      line += ' ' + p.percent + '%';
    } else {
      els.bar.classList.add('indeterminate');
      els.barFill.style.width = '';
      els.pct.textContent = '';
    }
    toast(line, 'info', true);
  }

  function formatBytes(n) {
    if (!n && n !== 0) return '';
    const units = ['B', 'KB', 'MB', 'GB'];
    let i = 0, v = n;
    while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
    return (i === 0 ? v : v.toFixed(v >= 100 ? 0 : 1)) + ' ' + units[i];
  }

  function formatDuration(s) {
    if (!s && s !== 0) return '';
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    const pad = n => String(n).padStart(2, '0');
    return h ? h + ':' + pad(m) + ':' + pad(sec) : m + ':' + pad(sec);
  }

  function fileNameFor(job) {
    let ext = '';
    try { ext = (new URL(job.downloadUrl).pathname.match(/\.([a-z0-9]{2,5})$/i) || [])[1] || ''; } catch (_) {}
    if (!ext) ext = job.actualFormat === 'audio-mp3' ? 'mp3' : (job.actualFormat || '').startsWith('audio') ? 'm4a' : 'mp4';
    const base = (job.title || 'video').replace(/[\\/:*?"<>|\u0000-\u001f]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 120) || 'video';
    return base + '.' + ext;
  }

  function showResult(job) {
    els.status.hidden = true;
    els.resTitle.textContent = job.title || 'Your file';
    els.resChips.textContent = '';
    [labelOf(job.actualFormat || job.format), formatBytes(job.fileSize), formatDuration(job.duration)]
      .filter(Boolean)
      .forEach(t => {
        const c = document.createElement('span');
        c.className = 'chip';
        c.textContent = t;
        els.resChips.appendChild(c);
      });
    const name = fileNameFor(job);
    els.resSave.href = job.downloadUrl;
    els.resSave.setAttribute('download', name);
    els.result.hidden = false;
    return name;
  }

  function triggerDownload(url, name) {
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    a.rel = 'noopener';
    a.target = '_blank';
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  function rejectInput(message) {
    els.field.classList.remove('shake');
    void els.field.offsetWidth;
    els.field.classList.add('shake');
    toast(message, 'error');
    els.url.focus();
  }

  /* ---------- Main flow ---------- */
  async function start() {
    if (busy) { if (controller) controller.abort(); return; }

    const id = parseVideoId(els.url.value);
    if (!id) return rejectInput('Enter a valid YouTube link');

    const url = 'https://youtu.be/' + id;
    const sel = FORMATS.find(f => f.id === selected);
    const chain = sel.video ? VIDEO_CHAIN.slice(VIDEO_CHAIN.indexOf(sel.id)) : [sel.id];

    controller = new AbortController();
    const signal = controller.signal;
    els.result.hidden = true;
    setBusy(true);
    showStatus('Preparing…');

    try {
      for (let i = 0; i < chain.length; i++) {
        const fmt = chain[i];
        toast('Queuing ' + labelOf(fmt) + '…', 'info', true);
        const job = await submitJob(url, fmt, signal);
        if (job.title) els.statusTitle.textContent = job.title;

        const final = await waitForJob(job.jobId, signal, renderProgress);

        if (final.status === 'COMPLETED') {
          const name = showResult(final);
          triggerDownload(final.downloadUrl, name);
          toast('Download ready', 'success');
          return;
        }
        if (final.errorCode === 'FORMAT_UNAVAILABLE' && i < chain.length - 1) {
          toast(labelOf(fmt) + ' isn’t available. Trying ' + labelOf(chain[i + 1]) + '…', 'info', true);
          els.bar.classList.add('indeterminate');
          els.barFill.style.width = '';
          els.pct.textContent = '';
          continue;
        }
        throw new ApiError(FAIL_MESSAGES[final.errorCode] || 'The download failed. Try again in a moment.', { code: final.errorCode });
      }
    } catch (e) {
      if (e.name === 'AbortError') toast('Cancelled', 'info');
      else toast(e.message || 'Something went wrong', 'error', false, 6500);
    } finally {
      hideStatus();
      setBusy(false);
      controller = null;
    }
  }

  /* ---------- Events ---------- */
  els.go.addEventListener('click', start);

  els.url.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); start(); }
  });

  els.url.addEventListener('input', () => els.field.classList.remove('shake'));

  els.paste.addEventListener('click', async () => {
    if (busy) return;
    try {
      const text = await navigator.clipboard.readText();
      if (text) { els.url.value = text.trim(); els.url.focus(); }
      else toast('Clipboard is empty', 'info');
    } catch (_) {
      toast('Clipboard access was blocked. Paste the link manually.', 'error');
    }
  });

  renderPills();
})();
</script>
</body>
</html>
